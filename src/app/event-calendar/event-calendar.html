<div class="event-calendar-header">
  <div class="cal-nav">
    <button matIconButton mwlCalendarPreviousView [view]="view" [(viewDate)]="viewDate" (viewDateChange)="onViewDateChange()" aria-label="Previous">
      <mat-icon>chevron_left</mat-icon>
    </button>
    <button matButton mwlCalendarToday [(viewDate)]="viewDate" (viewDateChange)="onViewDateChange()" class="cal-today-btn">Today</button>
    <button matIconButton mwlCalendarNextView [view]="view" [(viewDate)]="viewDate" (viewDateChange)="onViewDateChange()" aria-label="Next">
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>

  <span class="calendar-title">
    {{ viewDate | calendarDate: view + 'ViewTitle' : 'en' }}
    @if (loading) {
      <mat-spinner class="calendar-loading" [diameter]="22"></mat-spinner>
    }
  </span>

  <div class="cal-actions">
    <mat-form-field appearance="outline" class="cal-search" subscriptSizing="dynamic">
      <mat-label>Search</mat-label>
      <input matInput #calSearch placeholder="Tutor or student"
             (input)="applyFilter(calSearch.value)">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
    <!-- Admins create any session. Tutors get two buttons: their own
         make-ups, and their own Admin Time (client 2026-11-09, paid at their
         hourly rate). Support Staff only log their own Admin Time. -->
    @if (authService.loggedIn()) {
      <button mat-raised-button color="primary" (click)="openCreateSessionDialog()" class="cal-add-btn">
        <mat-icon>add</mat-icon>
        {{createButtonLabel}}
      </button>
      @if (showTutorAdminTime) {
        <button mat-raised-button (click)="openCreateSessionDialog('admin-time')" class="cal-add-btn">
          <mat-icon>schedule</mat-icon>
          Add Admin Time
        </button>
      }
    }
    <!-- "Add BTC & Me" was removed (client 2026-11-09: the program is not
         running). Existing group sessions still open in the group dialog,
         and openGroupSessionDialog('create') remains for a revival. -->
    <div class="cal-view-toggle">
      <button matButton (click)="setView(CalendarView.Month)" [class.active]="view === CalendarView.Month">Month</button>
      <button matButton (click)="setView(CalendarView.Week)" [class.active]="view === CalendarView.Week">Week</button>
      <button matButton (click)="setView(CalendarView.Day)" [class.active]="view === CalendarView.Day">Day</button>
    </div>
  </div>
</div>
<div class="event-calendar">
  @switch (view) {
    @case (CalendarView.Month) {
      <mwl-calendar-month-view
        class="event-cal-month event-cal"
        [viewDate]="viewDate"
        [events]="events"
        [refresh]="refresh"
        [activeDayIsOpen]="activeDayIsOpen"
        (dayClicked)="dayClicked($event.day)"
        (eventClicked)="handleEvent('Clicked', $event.event)"
        (eventTimesChanged)="eventTimesChanged($event)"
      />
    }
    @case (CalendarView.Week) {
      <mwl-calendar-week-view
        class="event-cal-week event-cal"
        [viewDate]="viewDate"
        [events]="events"
        [refresh]="refresh"
        (eventClicked)="handleEvent('Clicked', $event.event)"
        (eventTimesChanged)="eventTimesChanged($event)"
      />
    }
    @case (CalendarView.Day) {
      <mwl-calendar-day-view
        class="event-cal-day event-cal"
        [viewDate]="viewDate"
        [events]="events"
        [refresh]="refresh"
        (eventClicked)="handleEvent('Clicked', $event.event)"
        (eventTimesChanged)="eventTimesChanged($event)"
      />
    }
  }
</div>
