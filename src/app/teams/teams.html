<div class="teams">
  <div class="btc-page-header">
    <h2>Teams</h2>
    <div class="teams-controls">
      <mat-form-field subscriptSizing="dynamic" appearance="outline" class="teams-search">
        <mat-label>Search</mat-label>
        <input matInput #teamsSearch [value]="searchText"
             placeholder="Team, lead, member"
               (input)="applyFilter(teamsSearch.value)">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
      <button mat-raised-button color="primary" (click)="openCreateDialog()">
        <mat-icon>add</mat-icon>
        Add Team
      </button>
    </div>
  </div>

  <mat-card appearance="outlined">
    <mat-card-content>
      @if (loading) {
        <div class="table-spinner">
          <mat-spinner [diameter]="48"></mat-spinner>
          <span class="table-spinner-label">Loading teams…</span>
        </div>
      } @else if (dataSource.data.length === 0) {
        <p class="teams-empty">No teams yet. Add one to give a Lead Tutor visibility into their team's sessions.</p>
      } @else {
        <div class="table-scroll">
          <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">
            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>Team</th>
              <td mat-cell *matCellDef="let row">{{row.name}}</td>
            </ng-container>
            <ng-container matColumnDef="lead">
              <th mat-header-cell *matHeaderCellDef>Lead Tutor</th>
              <td mat-cell *matCellDef="let row">{{leadName(row)}}</td>
            </ng-container>
            <ng-container matColumnDef="members">
              <th mat-header-cell *matHeaderCellDef>Members</th>
              <td mat-cell *matCellDef="let row" class="members-cell">
                {{memberNames(row)}} ({{memberCount(row)}})
              </td>
            </ng-container>
            <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef></th>
              <td mat-cell *matCellDef="let row">
                <button matIconButton aria-label="Delete team"
                        (click)="openDeleteDialog(row, $event)">
                  <mat-icon>delete</mat-icon>
                </button>
              </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="columns"></tr>
            <tr mat-row *matRowDef="let row; columns: columns;" (click)="openEditDialog(row)"></tr>
          </table>
        </div>
        <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons/>
      }
    </mat-card-content>
  </mat-card>
</div>
